<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Report</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .card { background: white; max-width: 600px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .header { background: #f8fafc; color: #0f172a; padding: 24px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .header h1 { margin: 0; font-size: 20px; }
    .body { padding: 28px 24px; }
    .details { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 20px 0; }
    .details table { width: 100%; border-collapse: collapse; }
    .details td { padding: 8px 0; font-size: 14px; }
    .details td:first-child { color: #64748b; width: 40%; font-weight: 600; }
    .footer { background: #f8fafc; padding: 16px 24px; text-align: left; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>VC Verification Report</h1>
    </div>
    <div class="body">
      <p>Please find the results of the recent credential verification below.</p>
      <div class="details">
        <table>
          <tr><td>Tender ID</td><td><strong>{{TENDER_ID}}</strong></td></tr>
          <tr><td>Result</td><td><strong>{{VERIFICATION_RESULT}}</strong></td></tr>
        </table>
      </div>
    </div>
    <div class="footer">
      <p>Maharashtra Government Tender Portal</p>
    </div>
  </div>
</body>
</html>
