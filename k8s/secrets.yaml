apiVersion: v1
kind: Secret
metadata:
  name: tender-portal-secrets
  namespace: tender-portal
type: Opaque
# DO NOT COMMIT ACTUAL VALUES.
# Apply this template by running:
# kubectl create secret generic tender-portal-secrets \
#   --namespace=tender-portal \
#   --from-literal=DB_PASSWORD="your-db-password" \
#   --from-literal=SESSION_SECRET="your-session-secret" \
#   --from-literal=OIDC_PRIVATE_KEY="your-oidc-private-key" \
#   --from-literal=INJI_CLIENT_SECRET="your-certify-secret" \
#   --dry-run=client -o yaml | kubectl apply -f -
stringData:
  DB_PASSWORD: "<REPLACE-WITH-DB-PASSWORD>"
  SESSION_SECRET: "<REPLACE-WITH-SESSION-SECRET>"
  OIDC_PRIVATE_KEY: "<REPLACE-WITH-OIDC-PRIVATE-KEY-PEM>"
  INJI_CLIENT_SECRET: "<REPLACE-WITH-INJI-CERTIFY-CLIENT-SECRET>"
---
# Postgres requires POSTGRES_PASSWORD explicitly for initialization
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: tender-portal
type: Opaque
stringData:
  POSTGRES_USER: "tender_admin"
  POSTGRES_PASSWORD: "<REPLACE-WITH-DB-PASSWORD>"
  POSTGRES_DB: "tender_db"
