apiVersion: v1
kind: Namespace
metadata:
  name: tender-portal
  labels:
    name: tender-portal
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tender-portal-quota
  namespace: tender-portal
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
