apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tender-portal-ingress
  namespace: tender-portal
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  tls:
  - hosts:
    - tender.maharashtra.gov.in
    - verify.maharashtra.gov.in
    secretName: tender-portal-tls
  rules:
  - host: tender.maharashtra.gov.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: verify.maharashtra.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inji-verify-service
            port:
              number: 80
